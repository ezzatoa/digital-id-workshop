version: '3.8'

services:
  workshop-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-identity-workshop
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
