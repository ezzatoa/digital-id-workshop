version: '3.8'

services:
  workshop-app:
    build: .
    container_name: digital-identity-workshop
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
    env_file:
      - .env
